name: Fotos de la semana de Allie

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Lista JSON: [{"escena":"...","outfit":"..."}] (maximo 8)'
        required: true

permissions:
  contents: write

concurrency:
  group: fotos-allie
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Generar y subir
        run: python app/fotos_semana.py
        env:
          PLAN: ${{ inputs.plan }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Guardar
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A videos/prueba
          if ! git diff --cached --quiet; then
            git commit -m "Fotos de la semana [skip ci]"
            git pull --rebase
            git push
          fi
