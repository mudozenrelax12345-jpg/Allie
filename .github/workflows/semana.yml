name: Fotos de la semana de Allie

on:
  workflow_dispatch:
    inputs:
      temas:
        description: "Temas separados por | (vacío = los de personaje.yml)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: fotos-allie
  cancel-in-progress: false

jobs:
  semana:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -r requirements.txt
      - name: Comprobar que arranca con los inputs vacíos
        run: python app/prueba_vacias.py

      - name: Comprobar que el revisor distingue a Allie
        run: python app/prueba_identidad.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Comprobar que un modelo caído no tumba el trabajo
        run: python app/prueba_gemini_caida.py

      - name: Comprobar que para en seco si no hay cuota
        run: python app/prueba_cuota.py

      - name: Generar la semana
        run: python app/semana.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEMAS: ${{ inputs.temas }}
      - name: Guardar
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fotos de la semana [skip ci]"
            git pull --rebase
            git push
          fi
