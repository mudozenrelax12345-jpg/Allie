name: Respuestas de Allie

on:
  # Ocho veces al día, de 09:13 a 23:13 (hora de Madrid).
  #
  # Antes eran dos por hora, 34 despertares diarios. El problema es que el
  # repositorio es privado y GitHub cobra los minutos de Actions redondeando
  # HACIA ARRIBA por trabajo: un despertar que mira el reloj, decide que aún
  # no toca y se va, cuesta un minuto entero igual que uno que contesta. Entre
  # eso y el montaje de vídeos del otro repositorio, los 2.000 minutos
  # gratuitos del mes se agotaron el 13 de octubre a las 15:28 y TODO dejó de
  # ejecutarse: el reel, el banco y este bot, los tres a la vez y sin avisar.
  #
  # Ocho rondas al día bastan de sobra para contestar comentarios: nadie
  # espera que una influencer responda en treinta minutos, y de hecho hacerlo
  # siempre tan rápido se parece más a un bot que a una persona.
  schedule:
    - cron: "13 7,9,11,13,15,17,19,21 * * *"
  workflow_dispatch:
    inputs:
      accion:
        description: "¿Qué quieres hacer?"
        type: choice
        default: responder
        options:
          - responder     # contestar ahora a lo que haya pendiente
          - probar        # comprobar que las claves y los permisos funcionan
          - diagnostico   # mirar en crudo qué devuelve Instagram

permissions:
  contents: write
  issues: write

concurrency:
  group: respuestas-allie
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Este paso es muy corto a propósito: si todavía no toca, el trabajo
      # termina aquí y apenas gasta minutos de GitHub.
      - name: ¿Toca ya?
        id: toca
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          from datetime import datetime, timezone

          if os.environ.get("GITHUB_EVENT_NAME") != "schedule":
              print("seguir=si")           # si la lanzas tú a mano, siempre se ejecuta
              raise SystemExit

          f = pathlib.Path("estado/estado.json")
          e = json.loads(f.read_text()) if f.exists() else {}
          ultima, espera = e.get("ultima_pasada"), e.get("espera_minutos")
          if not ultima or not espera:
              print("seguir=si")
              raise SystemExit
          try:
              pasados = (datetime.now(timezone.utc)
                         - datetime.fromisoformat(ultima)).total_seconds() / 60
          except ValueError:
              print("seguir=si")
              raise SystemExit
          import sys
          print(f"Han pasado {pasados:.0f} min y tocaba esperar {espera}.", file=sys.stderr)
          print(f"seguir={'si' if pasados >= espera else 'no'}")
          PY

      - uses: actions/setup-python@v5
        if: steps.toca.outputs.seguir == 'si'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        if: steps.toca.outputs.seguir == 'si'
        run: pip install -r requirements.txt

      - name: Comprobar que en público no se publican datos de nadie
        run: python app/prueba_discrecion.py

      - name: Ejecutar
        if: steps.toca.outputs.seguir == 'si'
        run: python app/main.py
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Si el repositorio es público, los registros y las incidencias
          # los lee cualquiera: el programa tapa nombres y no copia
          # mensajes privados.
          REPO_PRIVADO: ${{ github.event.repository.private }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCION: ${{ inputs.accion }}

      - name: Guardar estado
        if: always() && steps.toca.outputs.seguir == 'si'
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado [skip ci]"
            git pull --rebase
            git push
          fi
