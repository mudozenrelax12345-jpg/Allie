name: Probar la comprobación de cara

# A mano. Comprueba, con las fotos reales del repositorio, que distinguir a
# Allie de otra mujer se puede hacer con OpenCV, sin gastar cuota de Gemini.
# No genera imágenes ni publica nada.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      # Los modelos pesan 37 MB y no cambian nunca: se guardan entre
      # ejecuciones para no bajarlos cada vez.
      - uses: actions/cache@v4
        with:
          path: /tmp/modelos-cara
          key: modelos-cara-v1

      - name: Comparar caras de verdad
        run: python app/prueba_cara.py

      - name: Guardar el informe salga como salga
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prueba de comprobación de cara [skip ci]"
            git pull --rebase
            git push
          fi
