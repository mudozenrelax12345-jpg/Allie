name: Reel diario de Allie

# Un reel al día, para sacar la cuenta del congelador.
#
# Entre mediados de julio y finales de septiembre la cuenta no publicó casi
# nada y Instagram dejó de repartirla: el reel del 9 de octubre llegó a 75
# personas con 3.221 seguidores, un 2%. Los carruseles los ven los seguidores
# y poco más; el único formato que Instagram enseña a quien NO te sigue es el
# reel, y el Trial Reel se enseña solo a no seguidores. Así que el plan es un
# Trial Reel diario durante un mes y medir si el alcance sube.
#
# TODO en un solo trabajo y con UN solo gasto de cuota. La cuota gratuita de
# Hugging Face da para unas cuatro o cinco imágenes al día y un reel necesita
# cuatro: si el banco genera por su lado y el reel genera por el suyo, el
# segundo se queda sin cuota. Aquí se genera una vez al banco y el reel se
# monta con esas mismas fotos.

on:
  schedule:
    # De lunes a viernes, no todos los días, y no por pereza: el plan gratuito
    # de Metricool permite 20 publicaciones al mes naturales. Uno diario son
    # treinta y se queda a medias el mes. Cinco por semana son 21 o 22, que
    # entra justo y deja sitio para alguna cosa suelta.
    #
    # TRES intentos al día, y el primer paso corta los que sobran. La ventana
    # de cuota de Hugging Face dura 24 horas desde la PRIMERA llamada que la
    # abre, así que su hora no es fija: se mueve al momento en que se generó
    # el día anterior. Con un solo intento diario a una hora fija, el día que
    # la ventana se va por detrás de esa hora el trabajo falla, no genera
    # nada, la ventana no se vuelve a anclar, y falla otra vez mañana. Un
    # trabajo que se bloquea para siempre sin que nadie entienda por qué.
    # Repartidos, alguno la pilla abierta.
    - cron: "40 5 * * 1-6"
    - cron: "40 11 * * 1-6"
    - cron: "40 16 * * 1-6"
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema (vacío = uno al azar)"
        type: string
        default: ""
      cuantas:
        description: "Cuántas fotos generar"
        type: string
        default: "4"
      forzar:
        description: "Rehacer el reel aunque ya haya uno de hoy"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: reel-allie          # el mismo que el reel semanal: nunca los dos a la vez
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Los modelos de cara pesan 37 MB y no cambian: se guardan
      # entre ejecuciones en vez de bajarlos cada vez.
      - uses: actions/cache@v4
        with:
          path: /tmp/modelos-cara
          key: modelos-cara-v1

      - name: Instalar
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Comprobar que ffmpeg está
        run: ffmpeg -version | head -1

      # Si ya hay reel de hoy, los demás intentos no tienen nada que hacer.
      - name: ¿Falta el reel de hoy?
        id: falta
        run: python app/falta_reel.py
        env:
          FORZAR: ${{ inputs.forzar }}

      # LAS ONCE COMPROBACIONES, EN UN SOLO PASO Y DEJANDO RASTRO.
      #
      # Estaban en once pasos separados, cada uno con su nombre bonito en la
      # pantalla de Actions. El 21 de octubre a las 17:11 falló «Comprobar el
      # camino de Cloudflare» y se llevó por delante el reel del día y el
      # relleno del banco. Y no hubo forma de saber por qué: los registros de
      # Actions se sirven desde un almacenamiento al que no se llega desde
      # fuera, así que el motivo se perdió. Once pasos con nombre bonito que
      # no se pueden leer valen menos que uno que escribe lo que pasó en un
      # fichero del repositorio.
      #
      # Así que van juntas, con marca por cada una, y si alguna se cae el
      # paso siguiente commitea el registro entero.
      - name: Comprobaciones
        run: |
          mkdir -p estado
          set -o pipefail
          {
            echo "Comprobaciones · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "falta el reel de hoy: ${{ steps.falta.outputs.falta }}"
            echo
          } > estado/ultimas-comprobaciones.txt

          siempre="prueba_texto_mira prueba_manos prueba_gemini_caida prueba_cloudflare"
          solo_si_falta="prueba_vacias prueba_identidad prueba_marca prueba_pisadas prueba_banco prueba_cuota"
          lista="$siempre"
          if [ "${{ steps.falta.outputs.falta }}" = "si" ]; then
            lista="$lista $solo_si_falta"
          fi

          malas=""
          for p in $lista; do
            echo "━━━━ $p" | tee -a estado/ultimas-comprobaciones.txt
            if python "app/$p.py" 2>&1 | tee -a estado/ultimas-comprobaciones.txt; then
              echo "   OK $p" | tee -a estado/ultimas-comprobaciones.txt
            else
              echo "   MAL $p" | tee -a estado/ultimas-comprobaciones.txt
              malas="$malas $p"
            fi
          done

          echo | tee -a estado/ultimas-comprobaciones.txt
          if [ -n "$malas" ]; then
            echo "FALLARON:$malas" | tee -a estado/ultimas-comprobaciones.txt
            exit 1
          fi
          echo "las $(echo $lista | wc -w) comprobaciones pasan" \
            | tee -a estado/ultimas-comprobaciones.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Lo que se escribe aquí es lo único que se puede leer después.
      - name: Dejar escrito por qué falló
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/ultimas-comprobaciones.txt
          git commit -m "Por qué falló una comprobación [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true

      # Si generar falla, el reel se monta igual con lo que haya en el
      # banco. El 16 de octubre había 71 fotos libres y el día se quedó sin
      # publicar porque este paso falló: tener material y no usarlo por un
      # fallo en el paso anterior es el peor de los dos mundos.
      - name: Generar las fotos del día
        continue-on-error: true
        if: steps.falta.outputs.falta == 'si'
        run: python app/banco.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CUANTAS: ${{ inputs.cuantas }}
          TEMAS: ${{ inputs.tema }}

      - name: Sacar las fotos del banco
        if: steps.falta.outputs.falta == 'si'
        run: python app/del_banco_a_fotos.py
        env:
          FOTOS_REEL: ${{ inputs.cuantas }}

      - name: Montar el reel con esas fotos
        if: steps.falta.outputs.falta == 'si'
        run: python app/reel.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TEMA: ${{ inputs.tema }}
          SOLO_MONTAR: "si"

      # Si el montaje falló, las fotos vuelven al banco: costaron la cuota del
      # día y mañana sirven igual.
      - name: Devolver las fotos si no salió el reel
        if: failure()
        continue-on-error: true
        run: python app/devolver_fotos.py

      - name: Guardar
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reel diario [skip ci]"
            git pull --rebase
            git push
          fi
