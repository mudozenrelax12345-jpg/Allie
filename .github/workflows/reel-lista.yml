name: Montar un reel de lista

# El reel que lleva dentro la información del carrusel: portada, una ficha
# por sitio con su calle y su horario, y cierre.
#
# POR QUÉ EXISTE. En cinco semanas los carruseles dieron 228 de alcance con
# 12 guardados y 6 seguidores; los reels, 130 con cero y cero. La diferencia
# no es el formato: es que el carrusel contiene algo que alguien quiere
# guardar y el reel no. Esto pone el contenido del carrusel en vertical.
#
# No publica. Deja el mp4 descargable para mirarlo antes de soltarlo.

on:
  workflow_dispatch:
    inputs:
      pieza:
        description: "Id de la pieza de contenido/cola.json (vacío = la primera libre)"
        type: string
        default: ""
      plataforma:
        description: "Dónde va: cambia las zonas seguras y el gancho"
        type: choice
        default: instagram
        options:
          - instagram
          - tiktok
      motor:
        description: "Qué máquina de voz"
        type: choice
        default: kokoro
        options:
          - kokoro
          - piper
      voz:
        description: "Kokoro: ef_dora · Piper: se elige abajo · vacío = mudo"
        type: choice
        default: ""
        options:
          - ""
          - ef_dora
          - em_alex
      piper_voz:
        description: "Voz de Piper. claude-high suena mejor (mexicana) · mls_9972 es de España"
        type: choice
        default: es_MX-claude-high
        options:
          - es_MX-claude-high
          - es_ES-mls_9972-low
          - es_ES-mls_10246-low
      ritmo:
        description: "Ritmo de la voz (1 normal · 0.92 más pausada)"
        type: string
        default: "1.0"
      tono:
        description: "Tono de la voz (1 normal · 1.06 más dulce · más de 1.10 suena a dibujos)"
        type: string
        default: "1.0"
      etiqueta:
        description: "Nombre de la Release donde dejarlo"
        type: string
        default: "reel-lista"

permissions:
  contents: write

concurrency:
  group: reel-allie
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Con las lecciones del 22 de octubre ya puestas: no pedir lo que ya
      # está, prohibir compilar desde el código fuente, un reloj por orden y
      # dejar escrito dónde se atasca. Aquel día tres arreglos a ojo costaron
      # cuarenta minutos y el registro lo resolvió en tres.
      - name: Instalar
        timeout-minutes: 20
        run: |
          mkdir -p estado
          registro=estado/ultima-instalacion-lista.txt
          echo "Instalación · $(date -u '+%Y-%m-%d %H:%M UTC')" > $registro
          corre() {
            local nombre="$1"; shift
            local t0=$(date +%s)
            echo "━━━━ $nombre" | tee -a $registro
            if timeout "$1" "${@:2}" 2>&1 | tail -20 | tee -a $registro; then
              echo "   OK $nombre · $(( $(date +%s) - t0 ))s" | tee -a $registro
            else
              echo "   MAL $nombre · $(( $(date +%s) - t0 ))s" | tee -a $registro
              return 1
            fi
          }
          # espeak-ng SOLO lo necesita Kokoro. Piper trae su propia
          # fonetización dentro del paquete, así que pedirlo con Piper es
          # arrastrar a apt sin motivo.
          faltan=""
          command -v ffmpeg >/dev/null || faltan="$faltan ffmpeg"
          if [ "${{ inputs.motor }}" != "piper" ]; then
            command -v espeak-ng >/dev/null || faltan="$faltan espeak-ng"
          fi
          fc-list 2>/dev/null | grep -qi dejavu || faltan="$faltan fonts-dejavu-core"
          echo "falta:${faltan:- nada}" | tee -a $registro
          set -o pipefail
          # apt ES INTERMITENTE EN ESTAS MÁQUINAS. El 22 de octubre el mismo
          # comando tardó 18 segundos en una ejecución y se pasó de 600 en la
          # siguiente, media hora después. No es la orden: es el momento —el
          # espejo de paquetes, o el proceso de actualizaciones automáticas
          # que tiene cogido el candado de dpkg. Contra algo intermitente no
          # sirve un tope más largo, sirve volver a intentarlo.
          if [ -n "$faltan" ]; then
            corre "apt update" 180 sudo apt-get update -qq || true
            instalado=""
            for intento in 1 2 3; do
              if corre "apt install (intento $intento)" 240 \
                   sudo DEBIAN_FRONTEND=noninteractive \
                   apt-get install -y -qq --no-install-recommends \
                   -o DPkg::Lock::Timeout=60 $faltan; then
                instalado="si"; break
              fi
              echo "   reintento en 20s" | tee -a $registro
              sleep 20
            done
            # PLAN B: ffmpeg SIN apt.
            #
            # El 22 de octubre apt falló tres veces seguidas de 240 segundos,
            # veinte minutos después de haber tardado 12. Cuando la única vía
            # para una herramienta se cae, no hace falta un cuarto intento:
            # hace falta otra vía. Los binarios estáticos de ffmpeg viven en
            # GitHub, que es de donde ya se descarga todo lo demás, y traen
            # ffmpeg y ffprobe sin instalar nada en el sistema.
            if [ -z "$instalado" ]; then
              echo "apt no entró en tres intentos · voy por el plan B" | tee -a $registro
              url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
              if corre "ffmpeg estático" 300 curl -fsSL "$url" -o /tmp/ff.tar.xz; then
                mkdir -p /tmp/ffb && tar -xf /tmp/ff.tar.xz -C /tmp/ffb --strip-components=1
                sudo cp /tmp/ffb/bin/ffmpeg /tmp/ffb/bin/ffprobe /usr/local/bin/
                hash -r
                ffmpeg -version | head -1 | tee -a $registro
              fi
            fi
            # Con Piper basta ffmpeg. Con Kokoro hace falta además espeak-ng,
            # y eso solo lo da apt.
            command -v ffmpeg >/dev/null || { echo "sin ffmpeg no hay vídeo" \
              | tee -a $registro; exit 1; }
            if [ "${{ inputs.motor }}" != "piper" ] && [ -n "${{ inputs.voz }}" ]; then
              command -v espeak-ng >/dev/null || { echo "Kokoro necesita espeak-ng y apt no lo dio. Usa motor=piper." \
                | tee -a $registro; exit 1; }
            fi
          fi
          corre "requirements" 420 pip install --only-binary=:all: -r requirements.txt
          if [ "${{ inputs.motor }}" = "piper" ] && [ -n "${{ inputs.voz }}" ]; then
            corre "piper" 300 pip install --only-binary=:all: piper-tts soundfile
            # El modelo, del repositorio oficial de voces de Piper.
            v="${{ inputs.piper_voz }}"
            idioma=$(echo "$v" | cut -d- -f1)           # es_MX
            nombre=$(echo "$v" | cut -d- -f2)            # claude
            calidad=$(echo "$v" | cut -d- -f3)           # high
            base="https://huggingface.co/rhasspy/piper-voices/resolve/main/es/$idioma/$nombre/$calidad/$v"
            mkdir -p /tmp/piper
            corre "modelo de voz" 180 curl -fsSL "$base.onnx" -o /tmp/piper/voz.onnx
            corre "config de voz"  60 curl -fsSL "$base.onnx.json" -o /tmp/piper/voz.onnx.json
            ls -la /tmp/piper | tee -a $registro
          elif [ -n "${{ inputs.voz }}" ]; then
            corre "torch cpu" 420 pip install --only-binary=:all: \
              --index-url https://download.pytorch.org/whl/cpu torch
            corre "kokoro" 420 pip install --only-binary=:all: kokoro soundfile
            # espeak-ng tiene que saber hablar español, no solo existir.
            espeak-ng -v es "prueba" --stdout > /dev/null 2>&1 \
              && echo "   OK espeak-ng habla español" | tee -a $registro || true
          fi

      - name: Dejar escrito dónde se atascó
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/ultima-instalacion-lista.txt 2>/dev/null || true
          git commit -m "Dónde se atascó la instalación [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true

      - name: Montar
        run: |
          mkdir -p estado
          set -o pipefail
          python app/reel_lista.py 2>&1 | tee estado/ultimo-reel-lista.txt
        env:
          PIEZA: ${{ inputs.pieza }}
          PLATAFORMA: ${{ inputs.plataforma }}
          VOZ: ${{ inputs.voz }}
          VOZ_RITMO: ${{ inputs.ritmo }}
          VOZ_TONO: ${{ inputs.tono }}
          MOTOR: ${{ inputs.motor }}
          EN_SECO: "si"        # devuelve las fotos al banco: esto no publica

      - name: Qué ha salido
        if: always()
        run: |
          for f in videos/reel_*.mp4; do
            [ -e "$f" ] || continue
            printf '%s  %s  %ss  audio:%s\n' "$(basename $f)" "$(du -h $f|cut -f1)" \
              "$(ffprobe -v error -show_entries format=duration -of csv=p=0 $f)" \
              "$(ffprobe -v error -select_streams a -show_entries stream=codec_name,duration -of csv=p=0 $f)"
          done

      - name: Dejarlo descargable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nuevo=$(ls -t videos/reel_*.mp4 | head -1)
          nombre="${{ inputs.plataforma }}-${{ inputs.voz && 'con-voz' || 'mudo' }}.mp4"
          cp "$nuevo" "/tmp/$nombre"
          gh release delete "${{ inputs.etiqueta }}" --yes --cleanup-tag || true
          gh release create "${{ inputs.etiqueta }}" \
            --title "Reel de lista · ${{ inputs.plataforma }}" \
            --notes "Montado sin publicar. Las fotos han vuelto al banco." \
            "/tmp/$nombre"

      - name: Guardar el registro
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Reel de lista [skip ci]"
            git pull --rebase --autostash || true
            git push || true
          fi
