name: Fotos de Allie

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema (vacío = uno al azar de personaje.yml)"
        type: string
        default: ""
      cuantas:
        description: "Cuántas fotos"
        type: string
        default: "3"

permissions:
  contents: write
  issues: write

concurrency:
  group: fotos-allie
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Generar y revisar
        run: python app/foto.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEMA: ${{ inputs.tema }}
          CUANTAS_FOTOS: ${{ inputs.cuantas }}

      - name: Guardar las fotos
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fotos nuevas de Allie [skip ci]"
            git pull --rebase
            git push
          fi
