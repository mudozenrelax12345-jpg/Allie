name: Subir una foto a un alojamiento publico

on:
  workflow_dispatch:
    inputs:
      ruta:
        description: "Ruta de la foto dentro del repo"
        required: true
        default: "videos/prueba/foto-20261007-2155.jpg"

permissions:
  contents: write

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: pip install requests

      - name: Subir
        env:
          RUTA: ${{ inputs.ruta }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, requests

          ruta = pathlib.Path(os.environ["RUTA"])
          if not ruta.exists():
              raise SystemExit(f"No existe {ruta}")

          AG = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/124.0 Safari/537.36"}

          def tmpfiles(f):
              r = requests.post("https://tmpfiles.org/api/v1/upload",
                                files={"file": f}, headers=AG, timeout=300)
              u = r.json().get("data", {}).get("url", "")
              # tmpfiles da una pagina; la descarga directa lleva /dl/ en medio
              return u.replace("tmpfiles.org/", "tmpfiles.org/dl/", 1)

          def envs(f):
              return requests.post("https://envs.sh", files={"file": f},
                                   headers=AG, timeout=300).text.strip()

          def litterbox(f):
              return requests.post("https://litterbox.catbox.moe/resources/internals/api.php",
                                   data={"reqtype": "fileupload", "time": "72h"},
                                   files={"fileToUpload": f}, headers=AG, timeout=300).text.strip()

          def uguu(f):
              r = requests.post("https://uguu.se/upload", files={"files[]": f},
                                headers=AG, timeout=300)
              return r.json()["files"][0]["url"]

          intentos = [("tmpfiles", tmpfiles), ("envs.sh", envs),
                      ("litterbox", litterbox), ("uguu", uguu)]

          url = None
          for nombre, fn in intentos:
              try:
                  with open(ruta, "rb") as f:
                      r = fn(f)
                  print(f"{nombre}: {str(r)[:200]}", flush=True)
                  if isinstance(r, str) and re.match(r"^https?://", r):
                      # comprobamos que de verdad se descarga como imagen
                      v = requests.get(r, headers=AG, timeout=120)
                      tipo = v.headers.get("content-type", "")
                      print(f"{nombre} comprobacion: HTTP {v.status_code} {tipo} "
                            f"{len(v.content)} bytes", flush=True)
                      if v.status_code == 200 and tipo.startswith("image/"):
                          url = r
                          break
              except Exception as e:
                  print(f"{nombre} fallo: {type(e).__name__}: {e}", flush=True)

          if not url:
              raise SystemExit("No se pudo subir a ningun alojamiento publico.")

          destino = pathlib.Path("videos/prueba/ultima-foto.json")
          destino.write_text(json.dumps({"ruta": str(ruta), "url": url}, indent=1), encoding="utf-8")
          print(f"URL PUBLICA: {url}", flush=True)
          PY

      - name: Guardar la direccion
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A videos/prueba
          if ! git diff --cached --quiet; then
            git commit -m "Direccion publica de la ultima foto [skip ci]"
            git pull --rebase
            git push
          fi
