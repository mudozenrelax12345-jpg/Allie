name: Canal · Un Short al día

# CUÁNDO Y POR QUÉ, con los datos delante.
#
# CINCO A LA SEMANA. Por debajo de tres, el alcance se encoge; por encima
# de siete, la retención de cada uno baja. Cinco está en la banda buena.
# Y uno al día, no los diez de golpe: un canal que suelta diez vídeos una
# tarde y luego nada parece una granja, y los diez compiten entre sí por el
# mismo hueco del feed.
#
# QUÉ DÍAS. Sobre 6.175 publicaciones medidas: sábado 1,13 · domingo 1,12 ·
# lunes 1,02 · viernes 1,00 · martes 0,97 · jueves 0,96 · miércoles 0,89.
# Se publica lunes, martes, viernes, sábado y domingo: cinco días, con los
# tres mejores dentro. Miércoles y jueves, los dos peores, se descansan.
#
# A QUÉ HORA. A la una de la tarde de NUEVA YORK, que es donde está la
# audiencia: el canal va en inglés y habla de empresas americanas. Ese es
# el pico, 1,28 veces lo normal. Las diez de la mañana de Madrid serían las
# cuatro de la madrugada allí.
#
# POR QUÉ DOS CRON. GitHub solo entiende UTC y no sabe de cambios de hora.
# Entre el 25 de octubre y el 1 de noviembre España ya cambió y Estados
# Unidos no, así que la una de Nueva York cae unos días a las 17:00 UTC y
# otros a las 18:00. Se ponen los dos y app/hora.py deja pasar solo el que
# de verdad cae a la una allí. Comprobado día a día durante un año entero.
#
# EL SHORT SE MONTA EN EL MOMENTO. Tres o cuatro minutos de máquina, que
# son gratis, en vez de 36 MB de mp4 guardados en el repositorio.

on:
  schedule:
    - cron: "5 17 * * 1,2,5,6,0"
    - cron: "5 18 * * 1,2,5,6,0"
  workflow_dispatch:
    inputs:
      en_seco:
        description: "Ensayo: lo monta pero no lo sube ni lo da por publicado"
        type: boolean
        default: false
      saltar_hora:
        description: "Lanzarlo ahora, sin esperar a la una de Nueva York"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: canal-cortos
  cancel-in-progress: false

defaults:
  run:
    working-directory: canal

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # La caché de pip no es un lujo: Kokoro arrastra PyTorch, que son casi
      # dos gigas. Sin ella, cada publicación diaria se pasa ocho minutos
      # descargando lo mismo que ayer.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: canal/requirements.txt

      - name: ¿Es la hora en Nueva York?
        if: github.event_name == 'schedule' || !inputs.saltar_hora
        run: python app/hora.py

      # PYTORCH EN SU VERSIÓN SIN CUDA, Y ESTO NO ES UNA OPTIMIZACIÓN.
      #
      # kokoro arrastra torch, y pip por defecto se baja la rueda con CUDA:
      # unos 2,5 GB de soporte para tarjeta gráfica, en una máquina de
      # GitHub que no tiene ninguna. El 22 de octubre ese paso se quedó
      # diecisiete minutos colgado y hubo que cancelarlo; dos días antes, con
      # la caché caliente, había tardado un minuto cincuenta.
      #
      # La rueda de CPU son unos 200 MB y sale del índice propio de PyTorch.
      # Se instala ANTES que el resto: cuando luego llega requirements.txt,
      # torch ya está satisfecho y pip ni lo mira.
      #
      # El tope de doce minutos es para que, si vuelve a colgarse, falle
      # rápido en vez de comerse la hora entera del trabajo.
      # --only-binary NO ES UNA OPTIMIZACIÓN, ES EL ARREGLO.
      #
      # El 22 de octubre este paso se colgó dos veces seguidas, más de doce
      # minutos cada una. Dos días antes había tardado 1:50 con las mismas
      # órdenes. Para descartar que fuera culpa mía lancé el flujo viejo sin
      # tocar nada: se colgó igual. O sea que no era la configuración: era la
      # instalación, ese día.
      #
      # La explicación que encaja: requirements.txt no fija ninguna versión
      # —«kokoro>=0.9», «soundfile», «numpy» a pelo— así que cualquier
      # dependencia que saque versión nueva sin paquete precompilado para
      # Python 3.12 hace que pip se ponga a COMPILARLA desde el código
      # fuente. Eso tarda quince minutos y no dice nada por pantalla.
      #
      # --only-binary=:all: prohíbe compilar: si no hay paquete ya hecho,
      # falla en segundos y con un mensaje claro en vez de colgarse.
      #
      # Y cada orden lleva su propio reloj y deja escrito cuánto tardó, para
      # que la próxima vez no haya que adivinar cuál de las cuatro fue.
      - name: Instalar
        timeout-minutes: 12
        run: |
          mkdir -p estado
          registro=estado/ultima-instalacion.txt
          echo "Instalación · $(date -u '+%Y-%m-%d %H:%M UTC')" > $registro
          corre() {
            local nombre="$1"; shift
            local t0=$(date +%s)
            echo "━━━━ $nombre" | tee -a $registro
            if timeout "$1" "${@:2}" 2>&1 | tail -25 | tee -a $registro; then
              echo "   OK $nombre · $(( $(date +%s) - t0 ))s" | tee -a $registro
            else
              echo "   MAL $nombre · $(( $(date +%s) - t0 ))s" | tee -a $registro
              return 1
            fi
          }
          # QUÉ FALTA DE VERDAD. La máquina de GitHub ya trae ffmpeg y las
          # fuentes DejaVu. Pedirlos otra vez no era gratis: arrastraba a apt
          # a resolver dependencias que ya estaban. Solo se instala lo que no
          # está, que en la práctica es espeak-ng, el fonetizador de Kokoro.
          faltan=""
          command -v ffmpeg     >/dev/null || faltan="$faltan ffmpeg"
          command -v espeak-ng  >/dev/null || faltan="$faltan espeak-ng"
          fc-list 2>/dev/null | grep -qi dejavu || faltan="$faltan fonts-dejavu-core"
          echo "ya instalado lo demás; falta:${faltan:- nada}" | tee -a $registro

          set -o pipefail
          if [ -n "$faltan" ]; then
            corre "apt update" 120 sudo apt-get update -qq
            # DPkg::Lock::Timeout en vez de esperar para siempre: en estas
            # máquinas el proceso de actualizaciones automáticas coge el
            # candado de dpkg y apt se queda ahí parado sin decir nada. Eso
            # es lo que colgó el paso tres veces el 22 de octubre.
            corre "apt install" 180 sudo DEBIAN_FRONTEND=noninteractive \
              apt-get install -y -qq -o DPkg::Lock::Timeout=120 $faltan
          fi
          corre "torch cpu"   420 pip install --only-binary=:all: \
                                    --index-url https://download.pytorch.org/whl/cpu torch
          corre "requirements" 420 pip install --only-binary=:all: -r requirements.txt
          python -c "import torch, kokoro; print('torch', torch.__version__)" | tee -a $registro

      # Si la instalación se cuelga o falla, que quede escrito CUÁL de las
      # cuatro órdenes fue. Es lo único que hoy no se pudo saber.
      - name: Dejar escrito dónde se atascó
        if: failure()
        continue-on-error: true
        working-directory: .
        run: |
          git config user.name "canal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canal/estado/ultima-instalacion.txt 2>/dev/null || true
          git commit -m "Dónde se atascó la instalación [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true

      - name: Comprobaciones
        run: |
          python app/prueba_hora.py
          python app/prueba_corto.py
          python app/prueba_subir.py

      - name: Montar y publicar el que toque
        run: |
          mkdir -p estado
          set -o pipefail
          python app/publicar_corto.py 2>&1 | tee estado/ultimo-corto-diario.txt
        env:
          EN_SECO: ${{ inputs.en_seco }}
          PRIVACIDAD: public
          KOKORO_VOZ: af_heart
          KOKORO_VELOCIDAD: "1.0"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - name: Anotar qué se publicó
        if: always()
        continue-on-error: true
        working-directory: .
        run: |
          git config user.name "canal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canal/estado/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Canal · Short del día [skip ci]"
            git pull --rebase --autostash || true
            git push || true
          fi
