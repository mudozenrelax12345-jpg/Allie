name: Una foto suelta de Allie

on:
  workflow_dispatch:
    inputs:
      escena:
        description: "Escena, en inglés (dónde está y qué hace)"
        required: true
        default: "walking along a tree-lined street in the Salamanca district of Madrid on a crisp October morning, autumn leaves on the pavement, warm low sunlight"
      outfit:
        description: "Outfit, en inglés (la ropa que SÍ queremos cambiar)"
        required: true
        default: "an open beige trench coat over a navy-and-white Breton striped knit, a pleated midi skirt and brown leather loafers, small shoulder bag"

permissions:
  contents: write

jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Generar la foto
        run: python app/foto.py
        env:
          ESCENA: ${{ inputs.escena }}
          OUTFIT: ${{ inputs.outfit }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Guardar la foto
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A videos/prueba
          if ! git diff --cached --quiet; then
            git commit -m "Foto suelta de Allie [skip ci]"
            git pull --rebase
            git push
          fi
