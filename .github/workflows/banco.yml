name: Llenar el banco de fotos de Allie

on:
  schedule:
    # Tres intentos al día. La cuota de Hugging Face no se renueva a medianoche:
    # la ventana dura 24 horas desde la PRIMERA llamada, así que se mueve cada
    # día según cuándo se usó. Con un solo intento diario, un día que la ventana
    # caiga mal se queda sin fotos; con tres, alguno pilla la ventana abierta.
    # Un intento sin cuota corta en menos de un minuto, así que fallar es
    # barato.
    - cron: "10 4 * * *"
    - cron: "10 11 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:
    inputs:
      cuantas:
        description: "Cuántas fotos intentar"
        type: string
        default: "9"
      temas:
        description: "Temas separados por | (vacío = al azar)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: banco-allie
  cancel-in-progress: false

jobs:
  llenar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Comprobar que arranca con los inputs vacíos
        run: python app/prueba_vacias.py

      - name: Comprobar que el revisor distingue a Allie
        run: python app/prueba_identidad.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Comprobar que al quitar las manos no quede contradicción
        run: python app/prueba_manos.py

      - name: Comprobar que ninguna foto pisa a otra
        if: steps.falta.outputs.falta == 'si'
        run: python app/prueba_pisadas.py

      - name: Comprobar que el banco reparte bien
        run: python app/prueba_banco.py

      - name: Comprobar que un modelo caído no tumba el trabajo
        run: python app/prueba_gemini_caida.py

      - name: Comprobar el camino de Cloudflare
        run: python app/prueba_cloudflare.py

      - name: Comprobar que para en seco si no hay cuota
        run: python app/prueba_cuota.py

      - name: Generar y revisar
        run: python app/banco.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CUANTAS: ${{ inputs.cuantas }}
          TEMAS: ${{ inputs.temas }}

      - name: Guardar el banco
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Banco de fotos actualizado [skip ci]"
            git pull --rebase
            git push
          fi
