name: Llenar el banco de fotos de Allie

on:
  schedule:
    # Tres intentos al día. La cuota de Hugging Face no se renueva a medianoche:
    # la ventana dura 24 horas desde la PRIMERA llamada, así que se mueve cada
    # día según cuándo se usó. Con un solo intento diario, un día que la ventana
    # caiga mal se queda sin fotos; con tres, alguno pilla la ventana abierta.
    # Un intento sin cuota corta en menos de un minuto, así que fallar es
    # barato.
    - cron: "10 4 * * *"
    - cron: "10 11 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:
    inputs:
      cuantas:
        description: "Cuántas fotos intentar"
        type: string
        default: "9"
      temas:
        description: "Temas separados por | (vacío = al azar)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: banco-allie
  cancel-in-progress: false

jobs:
  llenar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Los modelos de cara pesan 37 MB y no cambian: se guardan
      # entre ejecuciones en vez de bajarlos cada vez.
      - uses: actions/cache@v4
        with:
          path: /tmp/modelos-cara
          key: modelos-cara-v1

      - name: Instalar
        run: pip install -r requirements.txt

      # LAS COMPROBACIONES, JUNTAS Y DEJANDO RASTRO. Mismo motivo que en
      # reel-diario.yml: el 21 de octubre a las 17:12 cayó una de ellas y se
      # perdió el porqué, porque los registros de Actions no se pueden leer
      # desde fuera. Lo que se escribe en el repositorio, sí.
      #
      # Y DE PASO, UN FALLO QUE LLEVABA AQUÍ DESDE SIEMPRE: prueba_pisadas
      # tenía la condición «steps.falta.outputs.falta == 'si'», copiada del
      # flujo del reel. En el banco no hay ningún paso con ese id, así que la
      # condición era siempre falsa y esa comprobación NUNCA se ejecutaba.
      # Un paso en verde que no ha hecho nada es peor que no tenerlo.
      - name: Comprobaciones
        run: |
          mkdir -p estado
          set -o pipefail
          echo "Comprobaciones del banco · $(date -u '+%Y-%m-%d %H:%M UTC')" \
            > estado/ultimas-comprobaciones-banco.txt

          malas=""
          for p in prueba_vacias prueba_identidad prueba_manos prueba_pisadas \
                   prueba_banco prueba_gemini_caida prueba_cloudflare prueba_cuota; do
            echo "━━━━ $p" | tee -a estado/ultimas-comprobaciones-banco.txt
            if python "app/$p.py" 2>&1 | tee -a estado/ultimas-comprobaciones-banco.txt; then
              echo "   OK $p" | tee -a estado/ultimas-comprobaciones-banco.txt
            else
              echo "   MAL $p" | tee -a estado/ultimas-comprobaciones-banco.txt
              malas="$malas $p"
            fi
          done

          echo | tee -a estado/ultimas-comprobaciones-banco.txt
          if [ -n "$malas" ]; then
            echo "FALLARON:$malas" | tee -a estado/ultimas-comprobaciones-banco.txt
            exit 1
          fi
          echo "las ocho comprobaciones pasan" \
            | tee -a estado/ultimas-comprobaciones-banco.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Dejar escrito por qué falló
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/ultimas-comprobaciones-banco.txt
          git commit -m "Por qué falló una comprobación del banco [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true

      - name: Generar y revisar
        run: python app/banco.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CUANTAS: ${{ inputs.cuantas }}
          TEMAS: ${{ inputs.temas }}

      - name: Guardar el banco
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Banco de fotos actualizado [skip ci]"
            git pull --rebase
            git push
          fi
