name: Llenar el banco de fotos de Allie

on:
  schedule:
    # Todos los días a las 04:10 UTC. La cuota de Hugging Face se renueva cada
    # día, y a esa hora no compite con nada de lo que publica la cuenta: lo que
    # se genere de madrugada está disponible para todo el día.
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      cuantas:
        description: "Cuántas fotos intentar"
        type: string
        default: "9"
      temas:
        description: "Temas separados por | (vacío = al azar)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: banco-allie
  cancel-in-progress: false

jobs:
  llenar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Comprobar que el banco reparte bien
        run: python app/prueba_banco.py

      - name: Generar y revisar
        run: python app/banco.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CUANTAS: ${{ inputs.cuantas }}
          TEMAS: ${{ inputs.temas }}

      - name: Guardar el banco
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Banco de fotos actualizado [skip ci]"
            git pull --rebase
            git push
          fi
