name: Probar modelos gratuitos que conservan la cara

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          pip install -r requirements.txt
          pip install gradio_client

      - name: Comprobar que arranca con los inputs vacíos
        run: python app/prueba_vacias.py

      - name: Preguntar a Hugging Face
        run: python app/probar_hf.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar lo que haya salido
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prueba de modelos gratuitos [skip ci]"
            git pull --rebase
            git push
          fi
