name: Generar el pack de Halloween

# El primer producto de pago de Allie. Diez láminas para imprimir y cinco
# fondos de móvil, todas de la misma familia.
#
# Por qué imprimibles y no plantillas de invitación, que se buscan más
# (3.800 al mes frente a 3.200): las invitaciones llevan texto dentro y el
# generador no sabe dibujar letras. Una lámina no lleva ninguna.
#
# Cuesta unas 2.400 neuronas de las 10.000 del día: cabe de sobra.

on:
  workflow_dispatch:
    inputs:
      solo:
        description: "Rehacer solo estas piezas, separadas por coma (vacío = todas)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: reel-allie
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Generar
        run: |
          mkdir -p estado
          set -o pipefail
          python app/halloween.py 2>&1 | tee estado/ultimo-halloween.txt
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SOLO: ${{ inputs.solo }}

      - name: Guardar salga como salga
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Pack de Halloween [skip ci]"
            git pull --rebase
            git push
          fi
