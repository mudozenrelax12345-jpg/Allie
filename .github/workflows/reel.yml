name: Reel semanal de Allie

on:
  # Sin horario. Desde el 10 de octubre hay un reel DIARIO (reel-diario.yml) y
  # dos trabajos compitiendo por la misma cuota diaria significan que uno de
  # los dos se queda sin nada. Este se queda para lanzarlo a mano cuando se
  # quiera un reel concreto fuera de la rutina.
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema (vacío = uno al azar)"
        type: string
        default: ""
      solo_montar:
        description: "si = no generar, montar con las fotos guardadas"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: reel-allie
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Comprobar que ffmpeg está
        run: ffmpeg -version | head -1

      - name: Comprobar que arranca con los inputs vacíos
        run: python app/prueba_vacias.py

      - name: Comprobar que el revisor distingue a Allie
        run: python app/prueba_identidad.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Comprobar que un modelo caído no tumba el trabajo
        run: python app/prueba_gemini_caida.py

      - name: Comprobar el camino de Cloudflare
        run: python app/prueba_cloudflare.py

      - name: Comprobar que para en seco si no hay cuota
        run: python app/prueba_cuota.py

      - name: Montar el reel
        run: python app/reel.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TEMA: ${{ inputs.tema }}
          SOLO_MONTAR: ${{ inputs.solo_montar }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar el vídeo
        if: always()
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reel nuevo [skip ci]"
            git pull --rebase
            git push
          fi
