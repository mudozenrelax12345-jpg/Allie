name: Reel semanal de Allie

on:
  schedule:
    - cron: "40 17 * * 0"   # domingos, 19:40 en Madrid (18:40 en invierno)
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema (vacío = uno al azar)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: reel-allie
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Montar el reel
        run: python app/reel.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEMA: ${{ inputs.tema }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar el vídeo
        if: always()
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reel nuevo [skip ci]"
            git pull --rebase
            git push
          fi
