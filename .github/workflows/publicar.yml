name: Publicar el reel en Instagram

# Publica directamente por la API de Instagram, sin pasar por Metricool.
#
# Metricool regala 20 publicaciones al mes y el 16 de octubre iban 17 con
# quince días por delante. La API permite 25 cada 24 horas.
#
# El vídeo se sirve desde este mismo repositorio, que es público: dirección
# permanente, sin alojamientos temporales que caducan.

on:
  schedule:
    # 10:12 en Madrid los días que llevan REEL: lunes, miércoles, viernes y
    # sábado. Las 10:00 son el pico los siete días.
    #
    # Domingo, martes y jueves NO: esos días va un carrusel por Metricool, y
    # publicar dos cosas el mismo día hunde una de las dos. El 9 de octubre
    # salieron dos publicaciones: la primera llegó a 21 personas y la
    # segunda a 226.
    #
    # Minuto desplazado: a las horas en punto GitHub va cargado y retrasa.
    - cron: "12 8 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      en_seco:
        description: "Enseñar lo que publicaría, sin publicarlo (si/no)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: publicar-allie
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Los registros de Actions no se pueden leer desde fuera de GitHub, así
      # que cada paso deja su salida en un fichero que SÍ se guarda en el
      # repositorio. El 17 de octubre la publicación de las 10:33 falló sin
      # dejar un solo rastro: ni fichero de fallo, ni commit, nada. Diez
      # minutos mirando una pared. Eso no vuelve a pasar.
      - name: Empezar el parte
        run: |
          mkdir -p estado
          echo "# Última publicación · $(date -u '+%Y-%m-%d %H:%M') UTC" \
            > estado/ultima-publicacion.txt

      - name: Instalar
        run: |
          echo "## instalar" >> estado/ultima-publicacion.txt
          set -o pipefail
          pip install -r requirements.txt 2>&1 | tail -5 \
            | tee -a estado/ultima-publicacion.txt

      - name: Comprobar las barreras antes de tocar la cuenta
        run: |
          echo "## barreras" >> estado/ultima-publicacion.txt
          set -o pipefail
          python app/prueba_publicar_seguro.py 2>&1 \
            | tee -a estado/ultima-publicacion.txt

      # El marcado de IA se escribe con ffmpeg, y en el runner no viene
      # puesto. Los trabajos del reel sí lo instalan; aquí se me olvidó al
      # añadir el marcado, y por eso la publicación del sábado murió antes
      # de tocar Instagram.
      - name: Poner ffmpeg
        run: |
          echo "## ffmpeg" >> estado/ultima-publicacion.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1 | tee -a estado/ultima-publicacion.txt

      - name: Comprobar el marcado de IA del vídeo
        run: |
          echo "## marcado" >> estado/ultima-publicacion.txt
          set -o pipefail
          python app/prueba_marca.py 2>&1 | tee -a estado/ultima-publicacion.txt

      - name: Publicar
        run: |
          echo "## publicar" >> estado/ultima-publicacion.txt
          set -o pipefail
          python app/publicar.py 2>&1 | tee -a estado/ultima-publicacion.txt
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PRIVADO: ${{ github.event.repository.private }}
          EN_SECO: ${{ inputs.en_seco }}

      - name: Guardar el registro salga como salga
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicado en Instagram [skip ci]"
            git pull --rebase
            git push
          fi
