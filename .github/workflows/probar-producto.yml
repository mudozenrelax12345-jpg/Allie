name: Probar si el modelo respeta el producto del cliente

# La pregunta de la que depende poder venderle algo a una marca: si le
# mandas la foto de SU producto, ¿sale ese producto o sale uno parecido?
# Dos encargos inventados (un pañuelo y un bolso con colores que no existen)
# y dos pasos cada uno: el dibujo se vuelve foto de producto, y esa foto
# entra como segunda imagen en la escena con Allie.
#
# Usa el modelo GRANDE: son cuatro imágenes, unos 5.700 neuronas de las
# 10.000 del día. Si se lanza esto, hoy no se genera muestrario.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-allie
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: /tmp/modelos-cara
          key: modelos-cara-v1

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Generar los encargos de prueba
        run: python app/prueba_producto.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Guardar salga como salga
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prueba: ¿respeta el producto del cliente? [skip ci]"
            git pull --rebase
            git push
          fi
