name: Buscar generadores gratuitos que conserven la cara

on:
  workflow_dispatch:
    inputs:
      tope:
        description: "Cuántos espacios probar"
        type: string
        default: "18"

permissions:
  contents: write

concurrency:
  group: buscar-espacios
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          pip install -r requirements.txt
          pip install gradio_client

      - name: Comprobar que arranca con los inputs vacíos
        run: python app/prueba_vacias.py

      - name: Preguntar al catálogo y probar
        run: python app/buscar_espacios.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOPE_ESPACIOS: ${{ inputs.tope }}

      - name: Guardar el informe y las imágenes
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Informe de generadores gratuitos [skip ci]"
            git pull --rebase
            git push
          fi
