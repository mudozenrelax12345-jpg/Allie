name: Probar si se pueden buscar ubicaciones

# Etiquetar el LUGAR mete la publicación en el feed de ese sitio, que es
# donde mira la gente de Madrid buscando dónde ir. Vale más que el arroba
# para captar gente nueva y no depende de acertar ningún nombre de usuario.
#
# Pero el identificador es de una página de Facebook y hay que buscarlo con
# /pages/search, que necesita permisos que puede que este token no tenga.
# Antes de montar nada encima, se comprueba.

on:
  workflow_dispatch:
    inputs:
      sitios:
        description: "Sitios a buscar, separados por coma (vacío = los de prueba)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Buscar
        run: |
          mkdir -p estado
          set -o pipefail
          if [ -n "${{ inputs.sitios }}" ]; then
            IFS=',' read -ra S <<< "${{ inputs.sitios }}"
            python app/sitios.py "${S[@]}" 2>&1 | tee estado/prueba-sitios.txt
          else
            python app/sitios.py 2>&1 | tee estado/prueba-sitios.txt
          fi
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          REPO_PRIVADO: ${{ github.event.repository.private }}

      - name: Guardar salga como salga
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prueba de búsqueda de ubicaciones [skip ci]"
            git pull --rebase
            git push
          fi
