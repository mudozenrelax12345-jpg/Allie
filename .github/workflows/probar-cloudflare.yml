name: Probar Cloudflare

# A mano, para comprobar que las credenciales de Cloudflare funcionan y que
# las fotos que salen son Allie. Gasta un 1% del cupo diario (dos fotos de
# unas 110 neuronas cada una, de 10.000). No toca la cuota de Hugging Face.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-allie
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Comprobar el camino de Cloudflare sin gastar nada
        run: python app/prueba_cloudflare.py

      - name: Generar dos fotos de verdad y revisarlas
        run: python app/probar_cloudflare.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Variantes, por si el nombre se tecleó de otra forma: así el
          # informe puede decir «está, pero se llama X» en vez de «no hay
          # credenciales», que no ayuda a nadie.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          CF_ID: ${{ secrets.CF_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

      # Las fotos y el informe se guardan pase lo que pase: desde aquí no se
      # pueden mirar los registros de Actions, así que lo que no quede escrito
      # en el repositorio es como si no hubiera pasado.
      - name: Guardar el informe salga como salga
        if: always()
        continue-on-error: true
        run: |
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prueba de Cloudflare [skip ci]"
            git pull --rebase
            git push
          fi
