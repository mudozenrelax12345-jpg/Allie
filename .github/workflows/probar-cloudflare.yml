name: Probar Cloudflare

# A mano, para comprobar que las credenciales de Cloudflare funcionan y que
# las fotos que salen son Allie. Gasta un 1% del cupo diario (dos fotos de
# unas 110 neuronas cada una, de 10.000). No toca la cuota de Hugging Face.
#
# TODO se escribe en cloudflare/registro.txt y se sube pase lo que pase. Los
# registros de Actions no se pueden leer desde la sesión que lleva esto, así
# que un trabajo que falla sin dejar nada escrito es un trabajo que falla sin
# que nadie sepa por qué. Ya pasó una vez: ejecución en rojo, cero pistas.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-allie
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Empezar el registro
        run: |
          mkdir -p cloudflare
          {
            echo "# Registro · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo '```'
          } > cloudflare/registro.txt

      - name: Instalar
        run: |
          set -o pipefail
          echo "== instalar ==" | tee -a cloudflare/registro.txt
          pip install -r requirements.txt 2>&1 | tail -5 | tee -a cloudflare/registro.txt

      - name: Comprobar el camino de Cloudflare sin gastar nada
        run: |
          set -o pipefail
          echo "== prueba_cloudflare ==" | tee -a cloudflare/registro.txt
          python app/prueba_cloudflare.py 2>&1 | tee -a cloudflare/registro.txt

      - name: Generar dos fotos de verdad y revisarlas
        run: |
          set -o pipefail
          echo "== probar_cloudflare ==" | tee -a cloudflare/registro.txt
          python app/probar_cloudflare.py 2>&1 | tee -a cloudflare/registro.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Variantes, por si el nombre se tecleó de otra forma: así el
          # informe puede decir «está, pero se llama X» en vez de «no hay
          # credenciales», que no ayuda a nadie.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          CF_ID: ${{ secrets.CF_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

      # Las fotos, el informe y el registro se guardan pase lo que pase.
      - name: Guardar salga como salga
        if: always()
        continue-on-error: true
        run: |
          echo '```' >> cloudflare/registro.txt
          git config user.name "allie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prueba de Cloudflare [skip ci]"
            git pull --rebase
            git push
          fi
