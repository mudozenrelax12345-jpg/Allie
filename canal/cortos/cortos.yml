    narracion:
      - "Two drivers. Identical records. Neither has ever had an accident."
      - "One of them has a bad credit score."
      - "In twenty twenty-three, that driver was paying up to a hundred and fifteen percent more for car insurance. More than double."
      - "Not for anything they did on the road."
