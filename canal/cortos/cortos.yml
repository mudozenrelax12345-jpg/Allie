  - id: 08-es-expresion
    de: 03-alquiler
    titulo: "A Judge Ruled the Algorithm Has Free Speech"
    narracion:
      - "In September, a federal judge ruled that a rent-setting algorithm's recommendations are speech."
      - "Protected by the First Amendment."
      - "The software reads what tens of thousands of landlords are charging, works out what they could charge, and tells them."
      - "A court has now said that output is expression."
      - "Which means the question is no longer what the software does. It is what a company is allowed to say."
