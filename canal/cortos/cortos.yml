  - id: 06-nueve-de-diez
    de: 03-alquiler
    titulo: "\"It's Only a Recommendation\""
    narracion:
      - "It is only a recommendation. That is the defence."
      - "Former employees told ProPublica that as many as ninety percent of those recommendations get taken."
      - "One former executive said a property accepting all of them basically has a blindfold on, and is pushing a button."
      - "A recommendation taken nine times out of ten is not two parties deciding anything."
      - "We have a word for a lot of people independently reaching the same conclusion. We call it a market."
