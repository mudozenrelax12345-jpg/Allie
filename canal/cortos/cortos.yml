  - id: 02-rounding-error
    de: 02-precios            # 01-hertz no tiene imágenes propias: se le prestan
    titulo: "97% Clean. That's the Trick."
    narracion:
      - "Hertz says that of more than six hundred and seventy five thousand rentals scanned by its AI, over ninety seven percent showed no billable damage."
      - "Sounds reassuring. Do the arithmetic."
      - "Three percent of six hundred and seventy five thousand is around twenty thousand charges."
      - "Twenty thousand customers, at a few hundred dollars each."
      - "That is not a rounding error. That is a revenue line."
    imagenes: [g-escaner-caja, g-camara-techo, g-lupa, g-pantalla-codigo,
               g-recibo, g-datafono, g-dos-cajas, g-particulas, g-datacenter,
