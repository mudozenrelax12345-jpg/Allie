  - id: 05-ocupacion
    de: 03-alquiler
    titulo: "They Chose 95% Full Over 98%"
    narracion:
      - "Before the software, this landlord's buildings ran about ninety-eight percent full. After it, ninety-five."
      - "Forty thousand units. Three percent empty is about a thousand homes."
      - "And revenue went up."
      - "The chief executive of the software company told investors what the hard part had been. He said it was very hard for executives to accept that they could operate at ninety-four or ninety-six percent and make more money."
      - "Hard to accept. That is the interesting part."
