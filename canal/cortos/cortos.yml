# Los Shorts del canal.
#
# POR QUÉ EXISTEN. El canal tenía tres vídeos y veinticinco visualizaciones.
# No por lo que estaba escrito —eso está bien— sino porque un vídeo largo de
# un canal con seis suscriptores no se le enseña a nadie, y un Short entra en
# un feed de desconocidos desde el primer día. En el nicho de empresa, mezclar
# Shorts sube el crecimiento de suscriptores un 39 %; los canales que combinan
# los dos formatos crecen un 41 % más rápido que los de un solo formato.
#
# DE DÓNDE SALEN. De los tres guiones que ya existen. Ni una línea nueva de
# investigación: cada uno de estos diez estaba dentro de un vídeo largo, y las
# imágenes están generadas y pagadas desde el 10 de octubre.
#
# LA FORMA, que no es gusto mío sino lo que miden los datos del formato:
#   · 20-35 segundos. Por encima de 45 es muy difícil sostener el 80 %.
#   · El gancho en el segundo 1. Entre el 30 y el 50 % de la gente se va ahí.
#   · Cambio de plano cada 1,5-2 s. Por debajo de 1,2 cansa; por encima de
#     2,5 la retención baja.
#   · Subtítulos desde el primer fotograma: suben la retención sin sonido
#     entre un 25 y un 40 %, y la mayoría lo ve en silencio.
#   · La última imagen es la primera, para que el bucle no se note. Desde
#     2025 cada bucle cuenta como visualización nueva.
#
# EL ORDEN IMPORTA. El primero es el de la frase de la empatía porque es la
# mejor línea de todo el material. El segundo es el del «rounding error»,
# que es literalmente el nombre del canal: ese es el de presentación.

cortos:

  - id: 01-empatia
    de: 03-alquiler
    titulo: "They Said There Was Too Much Empathy"
    narracion:
      - "About a thousand apartments. Kept empty on purpose."
      - "Not abandoned. Not being repaired. Empty because a piece of software worked out that the rent on the other thirty-nine thousand would more than cover them."
      - "It was right. Revenue went up three to four percent."
      - "One of the men who built that software described the thinking behind it. He said: we said there's way too much empathy going on here."
      - "A thousand homes. In a housing shortage."
    imagenes: [g-piso-vacio, g-ventana-sola, g-torre-pisos, g-hoja-calculo,
               g-pantalla-cifras, g-grafico-subida, g-sala-juntas, g-mano-teclado,
