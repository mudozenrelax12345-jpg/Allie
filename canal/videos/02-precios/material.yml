# Material del vídeo 2 · El precio ya no es del producto
#
# Nueve clips y treinta y nueve imágenes. Los clips no son relleno: cada uno
# está puesto en una frase concreta del plan, donde el movimiento aporta algo
# que una foto fija no puede dar. El registro de material gastado impide que
# salga ninguno de los que ya usó el vídeo 1.

documentos:
  - nombre: DOC-A-carta-senadores-delta
    url: https://www.gallego.senate.gov/wp-content/uploads/2025/07/Delta-AI-Letter.pdf
    paginas: 3
  - nombre: DOC-B-carta-expedia
    url: https://oversight.house.gov/wp-content/uploads/2026/03/Letter-to-Expedia_3.5.2026.pdf
    paginas: 3

clips:
  - { nombre: v-coche-noche,    busca: "driving night" }   # 2.4 · el mismo trayecto
  # "city night" devolvió el perfil de Shanghái, con la torre Perla Oriental
  # bien visible. El vídeo habla de empresas y leyes de Estados Unidos: una
  # ciudad china en pantalla es una mentira pequeña, pero es una mentira.
  - { nombre: v-ciudad,         busca: "crosswalk night" }   # 3.10 · las dos frases juntas
  - { nombre: v-juzgado,        busca: "courthouse" }   # 4.10 · y vamos a las leyes
  # "street morning" devolvió una carretera de extrarradio al atardecer, sin
  # nadie. El cierre habla de gente, y hacía falta que se viera gente.
  - { nombre: v-calle,          busca: "people walking street" }   # 6.1 · el cierre

