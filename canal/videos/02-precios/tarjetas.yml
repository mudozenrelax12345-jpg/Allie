rotulos:
  - { nombre: R-HEARING,  texto: "Senate Judiciary subcommittee", sub: "4 august 2026" }
  - { nombre: R-DELTA,    texto: "Delta Air Lines", sub: "july 2025" }
  - { nombre: R-GROCERY,  texto: "Groceries. Delivery. Shelf labels.", sub: "what the laws reach" }
  - { nombre: R-BASTIAN,  texto: "Ed Bastian", sub: "chief executive, Delta Air Lines" }
