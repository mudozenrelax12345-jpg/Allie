  - nombre: T-HERTZ
    formato: lista
    etiqueta: "the last video"
    filas:
      - { de: "Hertz", a: "AI damage scanners", raya: true }
      - { de: "AI made enforcement", a: "cheap", acento: true }

  - nombre: T-NOTWRONG
    formato: frase
    lineas: ["I do not think the laws", "are wrong to exist."]

  - nombre: T-PATTERNWORKS
    formato: frase
    lineas: ["And pattern is what works."]
    acento: 0

