  - nombre: T-MARYLAND
    formato: lista
    etiqueta: "maryland · in force 1 october 2026"
    filas:
      - { de: "Grocery stores over", a: "15,000 sq ft", raya: true }
      - { de: "And food delivery", a: "·", acento: true }

  - nombre: T-NEWJERSEY
    formato: lista
    etiqueta: "new jersey · july 2026"
    filas:
      - { de: "Retailers setting grocery prices", a: "·", raya: true }
      - { de: "New electronic shelf labels", a: "paused one year", acento: true }

  - nombre: T-CONNECTICUT
    formato: lista
    etiqueta: "connecticut · june 2026"
    filas:
      - { de: "Retailers and third-party delivery", a: "·", raya: true }
