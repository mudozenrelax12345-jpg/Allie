# Montaje del vídeo 3 · versión de seis minutos
#
# Sin carteles de capítulo. Cuatro cartelitos a cuatro segundos son dieciséis
# de los trescientos sesenta que dura esto: en un vídeo de diez minutos
# ordenan, en uno de seis son señalización.
#
# Criterio: los momentos que llevan un dato van a una pantalla que lo
# demuestra —rejilla, barras, línea de tiempo, documento subrayado— y no a una
# tarjeta que repite la frase. Las imágenes generadas quedan para respirar
# entre medias, no para ilustrar cada idea.
#
# Y cada párrafo lleva material para su duración. En la versión anterior once
# párrafos tenían un solo elemento para diez o diecisiete segundos: el tiempo
# sobrante se quedaba en la pantalla que hubiera, y salieron ocho tarjetas
# congeladas de hasta diecisiete segundos y trece pares de planos seguidos con
# la misma foto. La regla es un elemento distinto por cada ocho segundos como
# mucho; app/plan.py lo comprueba y no deja montar si no se cumple. Las
# veintiocho imágenes que se añaden aquí ya estaban generadas y guardadas en el
# repositorio desde la primera vuelta, sin usar.

