# Material del vídeo 3 · RealPage
#
# Dos documentos públicos, cinco clips de archivo y las imágenes generadas.
# Las imágenes llevan el mismo estilo que los otros vídeos —oscuras, con un
# acento ámbar, sin caras y sin texto— y se quedan guardadas en el repositorio
# para que una segunda vuelta no las vuelva a pedir.

documentos:
  - nombre: DOC-A-demanda-realpage
    url: https://www.justice.gov/atr/media/1365471/dl
    paginas: 3
  - nombre: DOC-B-carta-warren
    url: https://www.warren.senate.gov/imo/media/doc/warren_letters_to_massachusetts_realpage.pdf
    paginas: 2

# Sin clips de archivo.
#
# Dos rondas, diez clips, ninguno aprovechable: nubes de tormenta por «edificio
# de noche», un pueblo holandés a pleno día por «edificios residenciales», un
# caracol por «cajas de mudanza», una máquina industrial por «caja de cartón» y
# el perfil de Dubái con el Burj Khalifa por «pisos de noche». Los que acertaban
# el tema venían en cian o a pleno sol, que choca con la paleta ámbar.
#
# El banco gratuito no da para este canal. Las imágenes generadas sí: de las 41
# primeras, 35 salieron bien a la primera. Estos cinco planos pasan a ser
# imágenes.
clips: []

# Dos que no se usan, y conviene que quede dicho para que nadie las vuelva a
# meter en el plan:
#   g-cajas       sale una persona con la cara visible
#   g-calendario  lleva texto grande inventado en el propio calendario
# El criterio del canal es sin caras y sin texto dentro de la imagen.

